<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Diario</title>
    <link rel="icon" type="image/x-icon" href="static\fotos\Logo (1).svg">
    <style>
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 8px 0;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #333;
            padding: 8px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
        }

        .checkbox-group label:hover {
            background: #e8f0fe;
        }

        .checkbox-group input[type=checkbox] {
            width: 18px;
            height: 18px;
            min-width: 18px;
            cursor: pointer;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        .header {
            background: #1a3a5c;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left h1 {
            font-size: 16px;
        }

        .header-left p {
            font-size: 11px;
            opacity: 0.8;
        }

        .metso-logo {
            font-size: 22px;
            font-weight: bold;
            font-style: italic;
            color: white;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 16px;
        }

        .btn-back {
            display: block;
            text-align: center;
            padding: 10px;
            color: #1a3a5c;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .seccion {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .seccion-titulo {
            font-size: 15px;
            font-weight: bold;
            color: #1a3a5c;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8f0fe;
            text-transform: uppercase;
        }

        label {
            display: block;
            font-size: 12px;
            color: #555;
            margin-bottom: 3px;
            margin-top: 10px;
        }

        input[type=text],
        input[type=email],
        input[type=date],
        input[type=number],
        select,
        textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 13px;
            background: #fafafa;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #1a3a5c;
            background: white;
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .grid3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .grid4 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px;
        }

        .hora-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .hora-group select {
            width: auto;
            min-width: 65px;
        }

        .hora-sep {
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }

        .tabla-pasos {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 12px;
        }

        .tabla-pasos th {
            background: #1a3a5c;
            color: white;
            padding: 8px 6px;
            text-align: left;
        }

        .tabla-pasos th:nth-child(2) {
            width: 90px;
            text-align: center;
        }

        .tabla-pasos th:nth-child(3) {
            width: 160px;
        }

        .tabla-pasos th:nth-child(4) {
            width: 80px;
            text-align: center;
        }

        .tabla-pasos td {
            padding: 6px;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        .tabla-pasos tr:nth-child(even) {
            background: #f9f9f9;
        }

        .paso-desc {
            font-size: 12px;
            color: #333;
            line-height: 1.4;
        }

        .paso-num {
            font-weight: bold;
            color: #1a3a5c;
        }

        .estado-select {
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 12px;
            width: 100%;
            background: white;
        }

        .estado-bueno {
            border-color: #28a745;
            background: #f0fff4;
        }

        .estado-malo {
            border-color: #dc3545;
            background: #fff5f5;
        }

        .btn-foto {
            display: block;
            width: 100%;
            padding: 6px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
        }

        .btn-foto:hover {
            background: #0b5ed7;
        }

        .foto-preview {
            width: 100%;
            max-height: 80px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 4px;
            display: none;
            cursor: pointer;
            border: 2px solid #dc3545;
        }

        .img-tecnica {
            width: 100%;
            max-width: 350px;
            display: block;
            margin: 10px auto;
            border-radius: 6px;
        }

        .metro-tabla {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }

        .metro-tabla th {
            background: #e8f0fe;
            color: #1a3a5c;
            padding: 6px;
            font-size: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .metro-tabla td {
            padding: 4px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .metro-tabla input {
            padding: 4px;
            font-size: 12px;
            text-align: center;
            border: none;
            background: transparent;
        }

        .metro-label {
            font-size: 12px;
            font-weight: bold;
            color: #1a3a5c;
        }

        .condicional {
            display: none;
            background: #fff8e1;
            border-left: 3px solid #ffc107;
            padding: 12px;
            border-radius: 0 8px 8px 0;
            margin-top: 10px;
        }

        .condicional.activo {
            display: block;
        }

        .banner-verde {
            background: #28a745;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin: 8px 0;
        }

        .banner-amarillo {
            background: #ffc107;
            color: #333;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin: 8px 0;
        }

        .obs-input {
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 11px;
            width: 100%;
            background: #fafafa;
        }

        .obs-input::placeholder {
            color: #bbb;
            font-style: italic;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 16px;
            background: #1a3a5c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .foto-input-hidden {
            display: none;
        }

        textarea.obs-grande {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 13px;
            background: #fafafa;
            min-height: 80px;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <h1>Checklist Diario TESTING</h1>
            <p id="folio-header">HB-...</p>
        </div>
        <div class="metso-logo">Metso</div>
    </div>
    <div class="container">
        <a href="/chinalco" class="btn-back">← Volver al inicio</a>
        <!-- FORMS !!! -->
        <form action="/chinalco_checklist/guardar" method="POST" enctype="multipart/form-data" id="form-armado">

            <div class="seccion">
                <div class="seccion-titulo">MONITOREO DE PARÁMETROS</div>

                <div class="grid2">
                    
                    <label>Medición de setting actual (mm)</label>
                    <input type="number" step="0.1" min="0" name="setting_actual" placeholder="milimetros">
                    <label>Medición de la altura Bowl (A)</label>
                    <input type="number" step="0.1" min="0" name="medicion_bowl" placeholder="milimetros">
                    <label>Verificar que la distribución de la alimentación sea uniforme</label>
                    <select type="number" name="alimentacion" placeholder="milimetros">
                        <option>Buen estado</option>
                        <option>Mal estado</option>
                        <option>N/A</option>
                    </select>
                </div>

                <label><strong>Observaciones al momento de tomar los parámetros</strong></label>
                <input type="text" name="observaciones" placeholder="Aquí los hallazgos encontrados">
            </div>
            <button type="submit" class="btn-submit">💾 Guardar checklist</button>
        </form>
    </div>
</body>

</html>
