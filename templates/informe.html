<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe Chancadora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .header { background: #000; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        .metso-brand { font-weight: 900; font-size: 22px; letter-spacing: 2px; }
        .container { max-width: 500px; margin: 30px auto; padding: 16px; }
        .btn-back { display: block; text-align: center; padding: 12px; color: #000; text-decoration: none; font-size: 14px; margin-bottom: 16px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size: 16px; color: #0f5132; margin-bottom: 16px; }
        label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; margin-top: 12px; }
        select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 7px; font-size: 14px; }
        .btn { display: block; width: 100%; padding: 14px; background: #0f5132; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>
<div class="header">
    <span class="metso-brand">METSO</span>
    <span style="font-size:13px; opacity:0.7;">Informe Estado Chancadora</span>
</div>
<div class="container">
    <a href="/" class="btn-back">← Volver al inicio</a>
    <div class="card">
        <h2>📊 Descargar Informe de Estado</h2>
        <p style="font-size:13px; color:#666;">Descarga el informe del último protocolo de cambio registrado para la chancadora seleccionada.</p>
        <label>Selecciona Chancadora</label>
        <select id="chancadora">
            <option value="">Seleccionar...</option>
            <option>CR011</option>
            <option>CR012</option>
            <option>CR013</option>
            <option>CR014</option>
            <option>CR021</option>
            <option>CR022</option>
            <option>CR023</option>
            <option>CR024</option>
        </select>
        <a href="#" class="btn" id="btn-descargar" onclick="descargar()">📄 Descargar Informe PDF</a>
        <a href="/informe/ppt" class="btn" style="background:#000; margin-top:10px;">📊 Descargar PPT Gerencial</a>
    </div>
</div>
<script>
function descargar() {
    const ch = document.getElementById('chancadora').value;
    if (!ch) { alert('Selecciona una chancadora'); return false; }
    window.location.href = '/informe/descargar/' + ch;
}
</script>
</body>
</html>
