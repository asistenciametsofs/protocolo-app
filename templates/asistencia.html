<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .header { background: #1a3a5c; color: white; padding: 16px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 18px; }
        .container { max-width: 500px; margin: 0 auto; padding: 16px; }
        .btn-back { display: block; text-align: center; padding: 12px; color: #1a3a5c; text-decoration: none; font-size: 14px; margin-bottom: 16px; }
        .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card-title { font-size: 15px; font-weight: bold; color: #1a3a5c; margin-bottom: 12px; }
        label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; margin-top: 8px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 7px; font-size: 14px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-ingreso { background: #28a745; color: white; }
        .btn-salida { background: #dc3545; color: white; }
        .btn-buscar { background: #1a3a5c; color: white; }
        .personal-card { background: #e8f0fe; border-radius: 10px; padding: 12px; margin: 10px 0; display: none; }
        .personal-nombre { font-size: 16px; font-weight: bold; color: #1a3a5c; }
        .personal-info { font-size: 12px; color: #555; margin-top: 4px; }
        .mensaje { padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-top: 10px; display: none; }
        .msg-ok { background: #d1e7dd; color: #0f5132; }
        .msg-err { background: #f8d7da; color: #842029; }
        .scanner-area { border: 2px dashed #1a3a5c; border-radius: 10px; padding: 16px; text-align: center; margin-bottom: 10px; color: #1a3a5c; font-size: 13px; }
        .links { display: flex; gap: 8px; margin-top: 16px; }
        .link-btn { flex: 1; padding: 10px; background: #f0f2f5; border-radius: 8px; text-align: center; text-decoration: none; color: #1a3a5c; font-size: 12px; font-weight: bold; }
    </style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div class="header">
    <h1>📋 Control de Asistencia</h1>
</div>
<div class="container">
    <a href="/" class="btn-back">← Volver al inicio</a>

    <div class="card">
        <div class="card-title">🔍 Buscar Personal</div>
        <div class="scanner-area">
            <button class="btn btn-buscar" onclick="toggleScanner()" id="btn_scanner" style="margin-bottom:8px">📷 Abrir cámara para escanear</button>
            <div id="reader" style="display:none;width:100%"></div>
        </div>
        <label>DNI</label>
        <input type="text" id="dni_input" placeholder="Ingresa DNI o escanea fotocheck" maxlength="20" onkeypress="if(event.key==='Enter') buscarPersonal()" autofocus>
        <button class="btn btn-buscar" onclick="buscarPersonal()">🔍 Buscar</button>
        <div class="personal-card" id="personal_card">
            <div class="personal-nombre" id="p_nombre"></div>
            <div class="personal-info" id="p_info"></div>
        </div>
    </div>

    <div class="card" id="registro_card" style="display:none">
        <div class="card-title">⏰ Registrar Asistencia</div>
        <label>Turno</label>
        <select id="turno_sel">
            <option value="DIA">DÍA</option>
            <option value="NOCHE">NOCHE</option>
        </select>
        <button class="btn btn-ingreso" onclick="registrar('ingreso')">✅ Registrar INGRESO</button>
        <button class="btn btn-salida" onclick="registrar('salida')" style="margin-top:8px">🚪 Registrar SALIDA</button>
        <div class="mensaje" id="mensaje"></div>
    </div>

    <div class="links">
        <a href="/asistencia/reporte" class="link-btn">📊 Ver Reporte</a>
        <a href="/asistencia/admin" class="link-btn">⚙️ Admin</a>
    </div>
</div>

<script>
let dniActual = '';

// Auto-focus para escaneo de código de barras
document.getElementById('dni_input').focus();

// Detectar escaneo (el scanner escribe rápido y presiona Enter)
let scanBuffer = '';
let scanTimer = null;
document.addEventListener('keypress', function(e) {
    if (document.activeElement === document.getElementById('dni_input')) return;
    if (e.key === 'Enter') {
        if (scanBuffer.length >= 6) {
            document.getElementById('dni_input').value = scanBuffer;
            buscarPersonal();
        }
        scanBuffer = '';
    } else {
        scanBuffer += e.key;
        clearTimeout(scanTimer);
        scanTimer = setTimeout(() => { scanBuffer = ''; }, 100);
    }
});

async function buscarPersonal() {
    const dni = document.getElementById('dni_input').value.trim();
    if (!dni) return;
    try {
        const res = await fetch(`/asistencia/buscar?dni=${dni}`);
        const data = await res.json();
        if (data.error) {
            mostrarMensaje(data.error, 'err');
            document.getElementById('personal_card').style.display = 'none';
            document.getElementById('registro_card').style.display = 'none';
            return;
        }
        dniActual = data.dni;
        document.getElementById('p_nombre').textContent = data.nombres;
        document.getElementById('p_info').textContent = `${data.perfil} | ${data.gerencia} | ${data.tipo_contrato}`;
        document.getElementById('personal_card').style.display = 'block';
        document.getElementById('registro_card').style.display = 'block';
        document.getElementById('mensaje').style.display = 'none';
    } catch(e) {
        mostrarMensaje('Error de conexión', 'err');
    }
}

async function registrar(tipo) {
    if (!dniActual) return;
    const turno = document.getElementById('turno_sel').value;
    try {
        const res = await fetch('/asistencia/registrar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({dni: dniActual, tipo, turno})
        });
        const data = await res.json();
        if (data.ok) {
            mostrarMensaje(`✅ ${tipo.toUpperCase()} registrado a las ${data.hora}`, 'ok');
            setTimeout(() => {
                document.getElementById('dni_input').value = '';
                document.getElementById('personal_card').style.display = 'none';
                document.getElementById('registro_card').style.display = 'none';
                document.getElementById('mensaje').style.display = 'none';
                dniActual = '';
                document.getElementById('dni_input').focus();
            }, 2000);
        } else {
            mostrarMensaje('Error al registrar', 'err');
        }
    } catch(e) {
        mostrarMensaje('Error de conexión', 'err');
    }
}

function mostrarMensaje(texto, tipo) {
    const el = document.getElementById('mensaje');
    el.textContent = texto;
    el.className = `mensaje msg-${tipo}`;
    el.style.display = 'block';
}
let scanner = null;
let scannerActivo = false;

function toggleScanner() {
    if (scannerActivo) {
        scanner.stop().then(() => {
            document.getElementById('reader').style.display = 'none';
            document.getElementById('btn_scanner').textContent = '📷 Abrir cámara para escanear';
            scannerActivo = false;
        });
    } else {
        document.getElementById('reader').style.display = 'block';
        document.getElementById('btn_scanner').textContent = '⏹ Cerrar cámara';
        scanner = new Html5Qrcode('reader');
        scanner.start(
            { facingMode: 'environment' },
            { fps: 30, qrbox: { width: 350, height: 80 }, formatsToSupport: [Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.EAN_13] },
            (decodedText) => {
                // Extraer DNI del QR peruano
                let dniExtraido = '';
                // Buscar 8 dígitos seguidos en el texto
                const match = decodedText.match(/\b\d{8}\b/);
                if (match) {
                    dniExtraido = match[0];
                } else {
                    dniExtraido = decodedText.replace(/\D/g,'').slice(0,8);
                }

                // Extraer 10 dígitos del fotocheck o 8 del DNI
                const match10 = decodedText.match(/\d{10}/);
                const match8 = decodedText.match(/\d{8}/);
                const valor = match10 ? match10[0] : (match8 ? match8[0] : decodedText.trim());
                document.getElementById('dni_input').value = valor;
                scanner.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('btn_scanner').textContent = '📷 Abrir cámara para escanear';
                    scannerActivo = false;
                    buscarPersonal();
                });
            },
            (error) => {}
        ).then(() => { scannerActivo = true; });
    }
}
</script>
</body>
</html>
