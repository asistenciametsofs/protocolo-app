<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficos de Chancadoras</title>
    <link rel="icon" type="image/x-icon" href="static\fotos\Logo (1).svg">

</head>

<body>
    <div class="header">
        <div class="header-left">
            <h1>---</h1>
            <p id="folio-header">HB-...</p>
        </div>
        <div class="metso-logo">Metso</div>
    </div>
    <div class="container">
        <a href="/chinalco" class="btn-back">← Volver al inicio</a>

        <div id="graficos-container" class="containergrf">
            {% for equipo in graficos %}
            <div class="cardgrf">
                <h3>{{ equipo }}</h3>
                <div id="grafico-{{ loop.index0 }}" class="chart"></div>
            </div>
            {% endfor %}
        </div>


    </div>


<!--<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script> -->

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script>
        const graficos = {{ graficos | tojson }};
        const instancias = [];

        window.graficos = graficos;

        Object.entries(graficos).forEach(([equipo, datos], i) => {
            const elemento = document.getElementById(`grafico-${i}`);
            

            if (!elemento) return;
            console.log(`Renderizando gráfico para ${equipo} en el elemento:`, elemento);

            const chart = echarts.init(elemento);
            instancias.push(chart);

            const puntos = datos.puntos || [];
            const proyeccion = datos.linea_proyectada || [];
            const alturaMinima = datos.altura_minima ?? 65;

            const series = [
                {
                    name: 'Altura medida',
                    type: 'line',
                    data: puntos,
                    smooth: false,
                    showSymbol: true,
                    symbolSize: 7,
                    lineStyle: {
                        width: 2
                    },
                    markLine: {
                        silent: true,
                        symbol: 'none',
                        data: [
                            {
                                name: 'Altura mínima',
                                yAxis: alturaMinima,
                                lineStyle: {
                                    color: '#e74c3c',
                                    type: 'dashed',
                                    width: 2
                                },
                                label: {
                                    formatter: `Mínimo: ${alturaMinima} mm`
                                }
                            }
                        ]
                    }
                }
            ];

            if (proyeccion.length === 2) {
                series.push({
                    name: 'Proyección',
                    type: 'line',
                    data: proyeccion,
                    showSymbol: true,
                    symbolSize: 7,
                    lineStyle: {
                        color: '#e74c3c',
                        type: 'dashed',
                        width: 3
                    }
                });
            }

            const option = {
                title: {
                    text: equipo,
                    subtext: datos.toneladas_objetivo != null
                        ? `Cambio estimado: ${Number(datos.toneladas_objetivo).toLocaleString('es-PE')} toneladas`
                        : 'Sin proyección disponible',
                    left: 'center'
                },

                tooltip: {
                    trigger: 'axis',
                    valueFormatter: value =>
                        value == null ? '-' : `${Number(value).toFixed(2)} mm`
                },

                legend: {
                    bottom: 0,
                    data: ['Altura medida', 'Proyección']
                },

                grid: {
                    left: 70,
                    right: 30,
                    top: 85,
                    bottom: 85
                },

                xAxis: {
                    type: 'value',
                    name: 'Toneladas acumuladas',
                    nameLocation: 'middle',
                    nameGap: 45,
                    axisLabel: {
                        formatter: value =>
                            Number(value).toLocaleString('es-PE')
                    }
                },

                yAxis: {
                    type: 'value',
                    name: 'Altura (mm)',
                    min: 0,
                    axisLabel: {
                        formatter: '{value} mm'
                    }
                },

                dataZoom: [
                    {
                        type: 'inside',
                        xAxisIndex: 0
                    },
                    {
                        type: 'slider',
                        xAxisIndex: 0,
                        bottom: 35
                    }
                ],

                series
            };

            chart.setOption(option);
        });

        window.addEventListener('resize', () => {
            instancias.forEach(chart => chart.resize());
        });
    </script>


</body>

</html>
