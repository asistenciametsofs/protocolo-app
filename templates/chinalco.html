<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolos Chinalco</title>
    <link rel="icon" type="image/x-icon" href="static\fotos\Logo (1).svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; }
        .header { background: white; color: black; padding: 20px; text-align: center; border-bottom: 4px solid black; }
        .header h1 { font-size: 22px; color: black; }
        .header p { font-size: 13px; color: #444; margin-top: 4px; }
        .metso-brand { font-weight: 900; color: black; font-size: 28px; letter-spacing: 2px; display: block; margin-bottom: 8px; }
        .container { max-width: 500px; margin: 30px auto; padding: 0 16px; }
        .flash { background: #d4edda; color: #155724; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size: 16px; color: #1a3a5c; margin-bottom: 8px; }
        .card p { font-size: 13px; color: #666; margin-bottom: 16px; }
        .btn { display: block; width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; margin-bottom: 10px; }
        .btn-primary { background: #1a3a5c; color: white; }
        .btn-secondary { background: #e8f0fe; color: #1a3a5c; }
        .btn-green { background: #28a745; color: white; }
        .btn-orange { background: #fd7e14; color: white; }
        .divider { text-align: center; color: #999; font-size: 12px; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="header">
        <span class="metso-brand">METSO</span>
        <h1>⚙️ Protocolos Chinalco</h1>
        <h1>-</h1>
        <p>Sistema de registro de protocolos</p>
        <p style="margin-top:8px;"><a href="{{ url_for('home') }}" style="color:#1a3a5c; font-size:12px; font-weight:bold; text-decoration:none;">🏠 Volver al inicio</a></p>
    </div>
    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="flash">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

    </div>
</body>
</html>
