services:
  - type: web
    name: protocolo-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120 --workers 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: protocolo-db
          property: connectionString

databases:
  - name: protocolo-db
    plan: free