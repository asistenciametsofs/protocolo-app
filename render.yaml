services:
  - type: web
    name: protocolo-app
    runtime: python
    buildCommand: pip install -r requirements.txt && npm install pptxgenjs
    startCommand: gunicorn app:app --timeout 300 --workers 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: protocolo-db
          property: connectionString

databases:
  - name: protocolo-db
    plan: free